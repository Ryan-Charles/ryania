<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@import url("../assets/fonts.css");
:root{
  --paper:#E4E6E1; --ink:#141715; --muted:#575D57; --rule:#C2C6BD;
  --signal:#1B36C4; --green:#146B52; --card:#EFF0EC;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:var(--paper);}
body{font-family:Archivo,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;position:relative}
#grain{position:absolute;inset:0;opacity:.055;pointer-events:none;z-index:50;mix-blend-mode:multiply}
.mono{font-family:"JetBrains Mono",monospace}
.serif{font-family:"Newsreader",Georgia,serif;font-weight:400}

/* chrome */
#bar{position:absolute;left:0;right:0;top:0;height:58px;display:flex;align-items:center;
  justify-content:space-between;padding:0 44px;border-bottom:1px solid var(--rule);z-index:20}
#bar span{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
#bar .mid{color:var(--ink);font-weight:500}
#prog{position:absolute;left:0;top:0;height:2px;background:var(--signal);z-index:30}
#dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:8px;vertical-align:1px}

/* stage */
.scene{position:absolute;inset:58px 0 0 0;}
.pad{padding:0 92px}

/* title scene */
#s_title .num{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:180px;line-height:.8;color:var(--signal)}
#s_title .name{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:68px;line-height:1.02;letter-spacing:-.01em;max-width:820px}
#s_title .sub{font-size:21px;color:var(--muted);max-width:640px;line-height:1.45;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--rule);background:var(--card);
  padding:8px 15px;border-radius:100px;font-family:"JetBrains Mono",monospace;font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* problem / result */
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--signal)}
.big{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:54px;line-height:1.1;max-width:960px;letter-spacing:-.005em}
.metricRow{display:flex;gap:0;margin-top:56px;border-top:1px solid var(--rule);padding-top:26px}
.metric{min-width:270px}
.metric .v{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:74px;line-height:.95}
.metric .k{font-family:"JetBrains Mono",monospace;font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:12px}

/* flow */
#flowTop{position:absolute;left:92px;right:92px;top:118px;height:250px}
#flowTop .st{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:48px;line-height:1.08;letter-spacing:-.005em;margin-top:14px;max-width:900px}
#flowTop .sb{font-size:19.5px;line-height:1.5;color:var(--muted);max-width:720px;margin-top:16px}
#chipData{display:inline-block;margin-top:26px;border:1px dashed var(--rule);background:var(--card);
  padding:11px 16px;font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--ink);border-radius:4px;max-width:960px}
#chipData b{color:var(--signal);font-weight:500}
#stepno{position:absolute;right:92px;top:124px;font-family:"JetBrains Mono",monospace;font-size:12.5px;
  letter-spacing:.16em;color:var(--muted);text-align:right}

#track{position:absolute;left:0;right:0;top:436px;height:180px;overflow:hidden}
#rail{position:absolute;left:0;top:56px;width:100%;height:1px;background:var(--rule)}
#nodes{position:absolute;left:0;top:0;height:180px;will-change:transform}
.nd{position:absolute;top:20px;width:186px;height:72px;border:1px solid var(--rule);background:var(--card);
  border-radius:6px;padding:11px 13px;display:flex;flex-direction:column;justify-content:space-between}
.nd .t{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nd .l{font-size:14px;font-weight:600;line-height:1.2}
.nd.past{background:#D7DAD3;border-color:var(--rule)}
.nd.act{border-color:var(--signal);border-width:1.5px;background:#fff;box-shadow:0 10px 24px -14px rgba(20,23,21,.42)}
.nd.act .t{color:var(--signal)}
.lnk{position:absolute;top:55px;height:1px;background:var(--rule)}
.pulse{position:absolute;top:52px;width:7px;height:7px;border-radius:50%;background:var(--signal)}
#tapeLbl{position:absolute;left:92px;top:436px;font-family:"JetBrains Mono",monospace;font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.rule{height:1px;background:var(--rule)}
#end .line{font-size:22px;color:var(--muted);max-width:820px;line-height:1.5;margin-top:44px}
</style></head>
<body>
<canvas id="grain" width="1280" height="720"></canvas>
<div id="prog"></div>
<div id="bar"><span id="b1">ryania.fr</span><span class="mid" id="b2"></span><span id="b3"><i id="dot"></i>n8n · production</span></div>

<div class="scene pad" id="s_title" style="display:none">
  <div style="position:absolute;top:60px;left:92px"><div class="num" id="t_num">01</div></div>
  <div style="position:absolute;top:270px;left:92px;right:92px">
    <div class="name" id="t_name"></div>
    <div class="sub" id="t_sub"></div>
    <div style="margin-top:34px;display:flex;gap:12px" id="t_chips"></div>
  </div>
</div>

<div class="scene pad" id="s_prob" style="display:none">
  <div style="position:absolute;top:150px;left:92px;right:92px">
    <div class="eyebrow" id="p_eye">Avant</div>
    <div class="big" id="p_txt" style="margin-top:22px"></div>
    <div class="metricRow" id="p_m"></div>
  </div>
</div>

<div class="scene" id="s_flow" style="display:none">
  <div id="flowTop">
    <div class="eyebrow" id="f_eye"></div>
    <div class="st" id="f_title"></div>
    <div class="sb" id="f_sub"></div>
    <div id="chipData"></div>
  </div>
  <div id="stepno"></div>
  <div id="tapeLbl">Flux d’exécution</div>
  <div id="track"><div id="rail"></div><div id="nodes"></div></div>
</div>

<div class="scene pad" id="s_end" style="display:none">
  <div style="position:absolute;top:140px;left:92px;right:92px" id="end">
    <div class="eyebrow">Après</div>
    <div class="big" id="e_txt" style="margin-top:22px"></div>
    <div class="metricRow" id="e_m"></div>
    <div class="line" id="e_line"></div>
  </div>
</div>

<script>
// ---------- grain (deterministic) ----------
(function(){
  const c=document.getElementById('grain'),x=c.getContext('2d');
  const d=x.createImageData(1280,720);let s=42;
  const rnd=()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296;};
  for(let i=0;i<d.data.length;i+=4){const v=rnd()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  x.putImageData(d,0,0);
})();

const S = window.SPEC;
const NW=186, GAP=76, PITCH=NW+GAP;
document.getElementById('b2').textContent = S.bar;

// build nodes
(function(){
  const wrap=document.getElementById('nodes');
  S.steps.forEach((st,i)=>{
    if(i>0){const l=document.createElement('div');l.className='lnk';
      l.style.left=(i*PITCH-GAP)+'px';l.style.width=GAP+'px';wrap.appendChild(l);}
    const n=document.createElement('div');n.className='nd';n.style.left=(i*PITCH)+'px';
    n.innerHTML='<div class="t">'+String(i+1).padStart(2,'0')+' · '+st.kind+'</div><div class="l">'+st.node+'</div>';
    wrap.appendChild(n);
  });
  const p=document.createElement('div');p.className='pulse';p.id='pulse';wrap.appendChild(p);
})();

const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const easeIO=t=>t<0?0:t>1?1:(t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2);
const clamp=(a,b,v)=>Math.max(a,Math.min(b,v));

function show(id){['s_title','s_prob','s_flow','s_end'].forEach(k=>{
  document.getElementById(k).style.display = (k===id?'block':'none');});}
function fade(el,p,dy){el.style.opacity=p;el.style.transform='translateY('+((1-p)*(dy||14))+'px)';}

const T = S.t; // {title:[a,b], prob:[a,b], flow:[a,b], end:[a,b]}
const DUR = S.duration;

window.renderAt = function(time){
  document.getElementById('prog').style.width = (time/DUR*1280)+'px';

  if(time < T.prob[0]){
    show('s_title');
    document.getElementById('t_num').textContent=S.num;
    document.getElementById('t_name').innerHTML=S.name;
    document.getElementById('t_sub').textContent=S.sub;
    const cw=document.getElementById('t_chips');
    if(!cw.dataset.on){cw.dataset.on=1;cw.innerHTML=S.chips.map(c=>'<span class="chip">'+c+'</span>').join('');}
    const a=time-T.title[0];
    fade(document.getElementById('t_num'), ease(a/.6), 26);
    fade(document.getElementById('t_name'), ease((a-.22)/.7), 22);
    fade(document.getElementById('t_sub'), ease((a-.42)/.7), 18);
    fade(cw, ease((a-.6)/.7), 16);
    const out=clamp(0,1,(T.prob[0]-time)/.4);
    document.getElementById('s_title').style.opacity=out;
    return;
  }

  if(time < T.flow[0]){
    show('s_prob');
    document.getElementById('p_eye').textContent=S.problem.eyebrow;
    document.getElementById('p_txt').innerHTML=S.problem.text;
    const mw=document.getElementById('p_m');
    if(!mw.dataset.on){mw.dataset.on=1;mw.innerHTML=S.problem.metrics.map(m=>
      '<div class="metric"><div class="v">'+m.v+'</div><div class="k">'+m.k+'</div></div>').join('');}
    const a=time-T.prob[0];
    fade(document.getElementById('p_eye'), ease(a/.5),12);
    fade(document.getElementById('p_txt'), ease((a-.15)/.75),20);
    [...mw.children].forEach((el,i)=>fade(el, ease((a-.55-i*.13)/.7),18));
    document.getElementById('s_prob').style.opacity=clamp(0,1,(T.flow[0]-time)/.4);
    return;
  }

  if(time < T.end[0]){
    show('s_flow');
    const f0=T.flow[0], f1=T.flow[1];
    const n=S.steps.length, per=(f1-f0)/n;
    const raw=(time-f0)/per;
    let i=Math.min(n-1, Math.floor(raw));
    const local=raw-i;                        // 0..1 within step
    const st=S.steps[i];

    // camera
    const target=x=> -(x*PITCH) + 92;
    const prev=Math.max(0,i-1);
    const k=easeIO(clamp(0,1,local/.34));
    const camX = target(prev)*(1-k)+target(i)*k;
    document.getElementById('nodes').style.transform='translateX('+camX+'px)';

    [...document.querySelectorAll('.nd')].forEach((el,j)=>{
      el.className='nd'+(j<i?' past':j===i?' act':'');
      el.style.opacity = j<=i? 1 : .42;
    });

    // pulse travelling on the link into the active node
    const pu=document.getElementById('pulse');
    if(i>0 && local<.34){
      const p=easeIO(local/.34);
      pu.style.opacity=1;
      pu.style.left=((i*PITCH)-GAP + p*GAP - 3)+'px';
    } else { pu.style.opacity=0; }

    // text block
    const app=ease(clamp(0,1,(local-.18)/.30));
    const el_e=document.getElementById('f_eye'), el_t=document.getElementById('f_title'),
          el_s=document.getElementById('f_sub'), el_c=document.getElementById('chipData');
    el_e.textContent=st.kind; el_t.innerHTML=st.title; el_s.innerHTML=st.sub||'';
    el_c.innerHTML=st.data||''; el_c.style.display=st.data?'inline-block':'none';
    fade(el_e,app,10); fade(el_t,app,18);
    fade(el_s,ease(clamp(0,1,(local-.26)/.30)),16);
    fade(el_c,ease(clamp(0,1,(local-.36)/.32)),14);
    document.getElementById('stepno').textContent='ÉTAPE '+String(i+1).padStart(2,'0')+' / '+String(n).padStart(2,'0');
    document.getElementById('s_flow').style.opacity=clamp(0,1,(T.end[0]-time)/.4);
    return;
  }

  show('s_end');
  document.getElementById('e_txt').innerHTML=S.result.text;
  const mw=document.getElementById('e_m');
  if(!mw.dataset.on){mw.dataset.on=1;mw.innerHTML=S.result.metrics.map(m=>
    '<div class="metric"><div class="v">'+m.v+'</div><div class="k">'+m.k+'</div></div>').join('');}
  document.getElementById('e_line').innerHTML=S.result.line;
  const a=time-T.end[0];
  fade(document.getElementById('e_txt'), ease(a/.6),20);
  [...mw.children].forEach((el,i)=>fade(el, ease((a-.4-i*.14)/.7),18));
  fade(document.getElementById('e_line'), ease((a-1.0)/.8),16);
};
</script>
</body></html>
